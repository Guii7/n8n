services:
  postgres:
    image: postgres:16-alpine
    container_name: n8n_postgres_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - n8n_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    command:
      - postgres
      - -c
      - max_connections=1000
      - -c
      - listen_addresses=*

  redis:
    image: redis:latest
    container_name: evolution_redis
    restart: unless-stopped
    command: redis-server --port 6379 --appendonly yes
    volumes:
      - evolution_redis:/data
    networks:
      - n8n_network
    expose:
      - "6379"

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: evolution_rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=user
      - RABBITMQ_DEFAULT_PASS=password
      - RABBITMQ_LOAD_DEFINITIONS=/etc/rabbitmq/definitions.json
      - RABBITMQ_DEFINITIONS_IMPORT_FILE=/etc/rabbitmq/definitions.json
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/definitions/rabbitmq-definitions.json:/etc/rabbitmq/definitions.json:ro
    networks:
      - n8n_network

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n_affiliate_bot
    restart: unless-stopped
    ports:
      - "5678:5678"
    env_file:
      - .env
    volumes:
      - n8n_data:/files
    networks:
      - n8n_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - n8n_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    expose:
      - "8080"

  # Cloudflare Tunnel
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared_tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - n8n_network
    depends_on:
      - n8n
      - evolution-api

  # N8N para Web Scraping (sem túnel)
  # n8n-scraper:
  #   build: ./n8n-scraper-custom
  #   container_name: n8n_scraper
  #   restart: unless-stopped
  #   ports:
  #     - "5679:5678"
  #   env_file:
  #     - .env.scraper # <-- ALTERAÇÃO PRINCIPAL AQUI
  #   volumes:
