services:
  # ---------------------------------------------------
  # SERVIÇOS DE INFRAESTRUTURA (EXISTENTES)
  # ---------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: n8n_postgres_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Adicionando o script de inicialização do Supabase
      - ./supabase/migrations:/docker-entrypoint-initdb.d
    networks:
      - n8n_network
      - bearcave_shared
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    command:
      - postgres
      - -c
      - max_connections=1000
      - -c
      - listen_addresses=*

  redis:
    image: redis:latest
    container_name: evolution_redis
    restart: unless-stopped
    command: redis-server --port 6379 --appendonly yes
    volumes:
      - evolution_redis:/data
    networks:
      - n8n_network
    expose:
      - "6379"

  rabbitmq:
    image: rabbitmq:4.1.4-management
    container_name: evolution_rabbitmq
    restart: unless-stopped
    hostname: rabbitmq-node1
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=user
      - RABBITMQ_DEFAULT_PASS=password
      - RABBITMQ_NODENAME=rabbit@rabbitmq-node1
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - n8n_network

  # ---------------------------------------------------
  # SERVIÇOS DE APLICAÇÃO (EXISTENTES)
  # ---------------------------------------------------
  n8n:
    build:
      context: ./docker/images/n8n-custom
      dockerfile: Dockerfile
    image: n8n-custom:latest
    container_name: n8n_affiliate_bot
    restart: unless-stopped
    ports:
      - "5678:5678"
    env_file:
      - .env
    environment:
      # Permite o uso de módulos externos (Puppeteer)
      - NODE_FUNCTION_ALLOW_EXTERNAL=puppeteer,puppeteer-extra,puppeteer-extra-plugin-stealth
      # Configurações do Puppeteer
      - PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium-browser
    volumes:
      - n8n_data:/files
      # Volume para sessões do Puppeteer (se necessário)
      - ./puppeteer_session:/home/node/.puppeteer_session
    networks:
      - n8n_network
      - bearcave_shared
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - n8n_network
    depends_on:
      - postgres
      - redis
      - rabbitmq

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared_tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - n8n_network
      - bearcave_shared
    depends_on:
      - n8n
      - evolution-api

volumes:
  n8n_data:
  postgres_data:
  evolution_redis:
  rabbitmq_data:
  evolution_instances:
  puppeteer_data:

networks:
  n8n_network:
  bearcave_shared:
    external: true
