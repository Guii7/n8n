  #     - ./puppeteer_session:/home/node/puppeteer_session
  #   networks:
  #     - n8n_network
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_started

volumes:
  n8n_data:
  postgres_data:
  evolution_redis:
  evolution_instances:
#  n8n_scraper_data:
  puppeteer_data:
