services:
  # ---------------------------------------------------
  # SERVIÇOS DE INFRAESTRUTURA (EXISTENTES)
  # ---------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: n8n_postgres_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - TZ=America/Sao_Paulo
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Adicionando o script de inicialização do Supabase
      - ./supabase/migrations:/docker-entrypoint-initdb.d
    networks:
      - n8n_network
      - bearcave_shared
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    command:
      - postgres
      - -c
      - max_connections=1000
      - -c
      - listen_addresses=*

  redis:
    image: redis:latest
    container_name: evolution_redis
    restart: unless-stopped
    command: redis-server --port 6379 --appendonly yes
    environment:
      - TZ=America/Sao_Paulo
    volumes:
      - evolution_redis:/data
    networks:
      - n8n_network
    expose:
      - "6379"

  rabbitmq:
    image: rabbitmq:4.1.4-management
    container_name: evolution_rabbitmq
    restart: unless-stopped
    hostname: rabbitmq-node1
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - TZ=America/Sao_Paulo
      - RABBITMQ_DEFAULT_USER=user
      - RABBITMQ_DEFAULT_PASS=password
      - RABBITMQ_NODENAME=rabbit@rabbitmq-node1
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - n8n_network

  # ---------------------------------------------------
  # SERVIÇOS DE APLICAÇÃO (EXISTENTES)
  # ---------------------------------------------------
  n8n:
    build:
      context: ./docker/images/n8n-custom
      dockerfile: Dockerfile
    image: n8n-custom:latest
    container_name: n8n_affiliate_bot
    restart: unless-stopped
    ports:
      - "5678:5678"
    env_file:
      - .env
    environment:
      # Configuração de Timezone
      - TZ=America/Sao_Paulo
      # Permite o uso de módulos externos (Puppeteer)
      - NODE_FUNCTION_ALLOW_EXTERNAL=puppeteer,puppeteer-extra,puppeteer-extra-plugin-stealth
      # Permite o uso de módulos built-in (fs, path, etc)
      - NODE_FUNCTION_ALLOW_BUILTIN=fs,path,buffer
      # Desabilitar Task Runner para permitir fs no Code node
      - N8N_RUNNERS_DISABLED=true
      # Configurações do Puppeteer
      - PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium-browser
      # Habilita todos os nós (incluindo Execute Command)
      - NODES_EXCLUDE=[]
    volumes:
      - n8n_data:/files
      # Volume para sessões do Puppeteer (se necessário)
      - ./puppeteer_session:/home/node/.puppeteer_session
      # Volume para avatares e vídeos de template (persistente)
      - ./avatars:/home/node/n8n_videos/avatars:ro
    tmpfs:
      - /tmp:size=2G,mode=1777
    networks:
      - n8n_network
      - bearcave_shared
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # Configuração de Timezone
      - TZ=America/Sao_Paulo
      # Força Node.js a usar IPv4 (resolve erro ENETUNREACH com CDN Amazon/Akamai)
      - NODE_OPTIONS=--dns-result-order=ipv4first
    sysctls:
      # Desabilita IPv6 no container (solução definitiva para ENETUNREACH)
      - net.ipv6.conf.all.disable_ipv6=1
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - n8n_network
    depends_on:
      - postgres
      - redis
      - rabbitmq

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared_tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - n8n_network
      - bearcave_shared
    depends_on:
      - n8n
      - evolution-api

  # ---------------------------------------------------
  # TYPEBOT SERVICES
  # ---------------------------------------------------
  typebot-builder:
    image: baptistearno/typebot-builder:latest
    container_name: typebot_builder
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - TZ=America/Sao_Paulo
      - HOSTNAME=0.0.0.0
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=${DATABASE_URL}
      - ENCRYPTION_SECRET=${ENCRYPTION_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXT_PUBLIC_VIEWER_URL=${NEXT_PUBLIC_VIEWER_URL}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - DISABLE_TELEMETRY=${DISABLE_TELEMETRY}
    env_file:
      - .env
    networks:
      - n8n_network
      - bearcave_shared
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  typebot-viewer:
    image: baptistearno/typebot-viewer:latest
    container_name: typebot_viewer
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      - TZ=America/Sao_Paulo
      - HOSTNAME=0.0.0.0
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=${DATABASE_URL}
      - ENCRYPTION_SECRET=${ENCRYPTION_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXT_PUBLIC_VIEWER_URL=${NEXT_PUBLIC_VIEWER_URL}
      - DISABLE_TELEMETRY=${DISABLE_TELEMETRY}
    env_file:
      - .env
    networks:
      - n8n_network
      - bearcave_shared
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  n8n_data:
  postgres_data:
  evolution_redis:
  rabbitmq_data:
  evolution_instances:
  puppeteer_data:

networks:
  n8n_network:
  bearcave_shared:
    external: true
